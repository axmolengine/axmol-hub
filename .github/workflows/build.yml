# 构建 + 验证 + 安装器打包，三个职责合在一个 workflow 里，靠 job 分层：
#   - meta：解析提交信息是否为 "Version x.y.z"，决定是否打包（普通提交只验证，不打包）。
#   - verify：三平台矩阵，验证代码正确性（编译、宿主判定、CLI 契约、下载契约），任何提交都跑。
#   - package-*：四平台各自在原生 runner 上跑 vpk pack（不能交叉出包），仅在 "Version" 提交或手动触发时跑。
# 是否发布由 dist.yml 根据提交信息与结果决定（与 axslcc 的 build.yml + dist.yml 语义一致）。
name: Build

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore:
      - '.github/workflows/dist.yml'
      - 'docs/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CONFIGURATION: Release
  DOTNET_SDK_VERSION: 10.0.x
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # ── 是否打包：解析提交信息。普通提交（非 "Version x.y.z"）只验证、不打包；
  #    只有发版提交或手动触发才走打包，把昂贵的 vpk pack 留给真正要发版的那一次。──
  meta:
    name: Decide packaging
    runs-on: ubuntu-24.04
    outputs:
      should_package: ${{ steps.decide.outputs.should_package }}
      is_prerelease: ${{ steps.decide.outputs.is_prerelease }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Decide
        id: decide
        shell: pwsh
        run: |
          $msg = "$(git log -1 --format=%s)"
          Write-Host "HEAD commit message: $msg"
          . ./installer/ReleaseMetadata.ps1
          & ./tests/ReleaseMetadata.Tests.ps1
          & ./tests/GitHubRelease.Tests.ps1
          [xml]$product = Get-Content -LiteralPath ./Directory.Build.props
          $productVersion = @($product.Project.PropertyGroup.Version) | Where-Object { $_ } | Select-Object -First 1
          $release = Get-ReleaseMetadata -CommitMessage $msg -FallbackVersion $productVersion
          # 手动触发视为发版（和 dist 的 workflow_dispatch 允许手动输版本呼应）。
          $isDispatch = '${{ github.event_name }}' -eq 'workflow_dispatch'
          $should = ($isDispatch -or $release.IsVersionCommit) -and '${{ github.event_name }}' -ne 'pull_request'
          # 输出小写 true/false，与 job 条件 needs.meta.outputs.should_package == 'true' 对齐。
          $flag = if ($should) { 'true' } else { 'false' }
          $prereleaseFlag = if ($release.IsPrerelease) { 'true' } else { 'false' }
          "should_package=$flag" >> $env:GITHUB_OUTPUT
          "is_prerelease=$prereleaseFlag" >> $env:GITHUB_OUTPUT
          Write-Host "should_package=$flag"
          Write-Host "is_prerelease=$prereleaseFlag"

  # ── 验证：代码没坏。三平台矩阵，与打包解耦，失败只代表代码回归，与发布无关。──
  verify:
    name: Verify (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            rid: win-x64
            host: windows
          - os: macos-15
            label: macOS arm64
            rid: osx-arm64
            host: macos
          - os: ubuntu-24.04
            label: Linux x64
            rid: linux-x64
            host: linux
    steps:
      # action 均取浮动主版本标签：这些主版本要求 Actions Runner >= 2.327.1（Node.js 24 运行时），
      # GitHub 托管 runner 满足。迁移到自托管 runner 时需先升级 runner。
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      # 上面的 env 只是"申请 10.0.x"，setup-dotnet 实际解析到哪个补丁版本才决定编译器版本。
      # 这个差异已经真实咬过一次（2026-10-03）：本机 Ubuntu 用 apt 装 dotnet-sdk-8.0
      # 只能拿到 8.0.1xx（编译器 4.8.0.0），而 Avalonia 12.1.3 的分析器与生成器是按
      # 4.14 编译的，源生成器整个不产出，表现为一排
      # `CS0103: The name 'InitializeComponent' does not exist`。
      # 以后本机与 CI 构建结果不一致时，先比这一行，不要靠猜。
      - name: Print .NET SDK version
        run: |
          dotnet --version
          dotnet --info

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ matrix.rid }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ matrix.rid }}-

      # 仓库没有解决方案文件：四个项目各自独立构建，一次只能接一个 csproj。
      - name: Build Core
        run: dotnet build src/AxmolHub.Core/AxmolHub.Core.csproj -c ${{ env.CONFIGURATION }}

      - name: Build CLI
        run: dotnet build src/AxmolHub.Cli/AxmolHub.Cli.csproj -c ${{ env.CONFIGURATION }}

      # 宿主判定（BuildTargets.Host）是 Core 里最早按操作系统分叉的逻辑，
      # 目标是否可在本机构建直接决定 GUI 给用户显示什么，因此三个平台都要断言。
      # （密钥存储后端也按 OS 分叉了，见下面的 --check-secrets；那条断言只覆盖 CLI 这一半。）
      - name: Verify host detection
        shell: bash
        run: |
          set -euo pipefail
          dotnet src/AxmolHub.Cli/bin/Release/net8.0/AxmolHub.Cli.dll targets | tr -d '\r' | tee targets.txt
          expect() {
            grep -qE "^$1[[:space:]]+.*current=$2$" targets.txt || { echo "::error::$1 expected current=$2"; exit 1; }
          }
          case "${{ matrix.host }}" in
            windows)
              expect windows-x64 True
              expect uwp-x64 True
              expect android-arm64 True
              expect wasm32 True
              expect linux-x64 False
              expect macos-arm64 False
              expect ios-arm64 False
              ;;
            macos)
              expect macos-arm64 True
              expect macos-x64 True
              expect ios-arm64 True
              expect tvos-arm64 True
              expect android-arm64 True
              expect wasm32 True
              expect windows-x64 False
              expect uwp-x64 False
              expect linux-x64 False
              ;;
            linux)
              expect linux-x64 True
              expect android-arm64 True
              expect wasm32 True
              expect windows-x64 False
              expect uwp-x64 False
              expect macos-arm64 False
              expect ios-arm64 False
              ;;
          esac

      - name: Verify CLI help
        shell: bash
        run: |
          set -euo pipefail
          dotnet src/AxmolHub.Cli/bin/Release/net8.0/AxmolHub.Cli.dll help | tr -d '\r' | tee help.txt
          grep -q 'install-tools' help.txt

      # Avalonia 版 GUI 是 net8.0，不含任何 Windows 专属目标框架，因此三平台都必须构建。
      # 这是唯一的 GUI **构建**步骤：P6 删掉 WPF 版后，App 就只剩 Avalonia 这一个实现了。
      - name: Build App (GUI)
        run: dotnet build src/AxmolHub.App/AxmolHub.App.csproj -c ${{ env.CONFIGURATION }}

      # 密钥存储是**按平台分叉**的产品行为，而 Windows 侧的 Checks 与需要显示器的 --verify-shell
      # 都到不了 Linux 这条路径：前者是 net8.0-windows，后者在 CI 里从不真跑 GUI（见 docs/ci.md §2.2）。
      # 所以用 App 的无头自检补上这格：它在 Avalonia 启动之前就返回，不需要 X11，
      # 跑的是生产入口 SecretStoreFactory.Create()，不是另写一份测试专用实现。
      # macOS 会把"本平台暂无后端"当 PASS 分支（Keychain 是有意延后，不该让矩阵为它变红）。
      - name: Verify secret store on this host
        shell: bash
        run: |
          set -euo pipefail
          dotnet src/AxmolHub.App/bin/Release/net8.0/AxmolHub.App.dll --check-secrets | tr -d '\r' | tee secrets.txt
          grep -q '^backend=' secrets.txt
          if [ "${{ matrix.host }}" = linux ]; then
            grep -q '^backend=encryptedfile$' secrets.txt
          fi
          ! grep -q '^FAIL' secrets.txt

      # Checks 是 net8.0-windows（Windows 特有的断言需要它），因此留在 Windows。
      # 这里只做编译验证，不跑 GUI：无头截图环节已去掉，理由见 docs/ci.md §2.2。
      - name: Build behavior checks
        if: matrix.host == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          dotnet build tests/AxmolHub.Checks/AxmolHub.Checks.csproj -c ${{ env.CONFIGURATION }}

      # --json 是 Hub 对外契约的一部分（docs/cli-json-contract.md），它唯一的失败模式是
      # "stdout 不再是恰好一份 JSON 文档" —— 编译期和形状断言都测不到那种错（help 就是这么漏过去的）。
      # 该模式自带 return，不需要真实引擎与工具链，因此能在干净 runner 上跑。
      # 只放 Windows 是因为 Checks 是 net8.0-windows（Core 里 Windows 特有的断言需要它），
      # 不是因为这个契约只在 Windows 成立 —— CLI 本身三平台都发布。
      # bin/Release 的写法与上面的"宿主判定"步骤一致。
      - name: Verify CLI JSON contract
        if: matrix.host == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project tests/AxmolHub.Checks -c ${{ env.CONFIGURATION }} -- \
            artifacts/checks --check-cli-json src/AxmolHub.Cli/bin/Release/net8.0/AxmolHub.Cli.dll

      # 下载契约（原子落盘 / 缓存复用 / 坏哈希拒绝 / 断点续传 / 流式 SHA-256）自带 return、
      # 用注入的 FixtureHandler、不联网、不依赖真实引擎，因此能在干净 runner 上跑。
      - name: Verify download contract
        if: matrix.host == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project tests/AxmolHub.Checks -c ${{ env.CONFIGURATION }} -- \
            artifacts/checks --check-download

      # 密钥格式（AAD 绑定、篡改拒绝、外来 DPAPI blob 识别）、后端选择表、密钥路径优先级、
      # OAuth 回调解析与 Linux 浏览器启动参数表——全部是纯函数或注入式假传输，
      # 因此在 Windows 上就能把 Linux 分支断言到；能在本机真跑的 Linux 那半是上面的 --check-secrets。
      - name: Verify secret store contract
        if: matrix.host == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project tests/AxmolHub.Checks -c ${{ env.CONFIGURATION }} -- \
            artifacts/checks --check-secret-store

      - name: Publish self-contained CLI
        run: dotnet publish src/AxmolHub.Cli/AxmolHub.Cli.csproj -c ${{ env.CONFIGURATION }} -r ${{ matrix.rid }} --self-contained true -o artifacts/cli/${{ matrix.rid }}

      # 交叉发布不等于可用：自包含产物必须在目标宿主上真的执行过。
      - name: Run published CLI on this host
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.host }}" in
            windows) exe=artifacts/cli/${{ matrix.rid }}/AxmolHub.Cli.exe ;;
            *)       exe=artifacts/cli/${{ matrix.rid }}/AxmolHub.Cli ;;
          esac
          test -f "$exe" || { echo "::error::missing published host binary: $exe"; exit 1; }
          ls -l "$exe"
          "$exe" targets | tr -d '\r' | head -3

      # 这里曾有一步 "Upload CLI host"，把 artifacts/cli/<rid> 作为 cli-<rid> 上传。2026-10-03 删除：
      # 没有任何后续消费方（发布链路的 App 产物由 installer/Build.ps1 自行发布，不读 CI 的 CLI 产物），
      # 它想证明的"产物可用"已由上面两步（发布 + 在目标宿主真跑）证明，artifact 只是把同一个结论再存一份。

  # ── 打包：安装器产物。artifact 名必须恰好等于平台目录名（win-x64 等），
  #    因为 dist 的 Publish-All.ps1 按平台目录名（Dir）在下载目录里找子目录。──
  package-win-x64:
    name: Package Windows x64
    needs: meta
    if: needs.meta.outputs.should_package == 'true'
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-release-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-release-

      - name: Prepare pinned Velopack CLI
        run: dotnet run --project tests/AxmolHub.Checks -c Release -- artifacts/packaging-tools --prepare-packaging

      - name: Build release packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE_BUILD: ${{ needs.meta.outputs.is_prerelease }}
        run: |
          $prereleaseBuild = $env:PRERELEASE_BUILD -eq 'true'
          ./installer/Publish.ps1 -Stage Build -Runtime win-x64 -PrereleaseBuild:$prereleaseBuild

      - name: Isolated install acceptance
        shell: pwsh
        run: ./installer/Test.ps1 -Isolated

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: win-x64
          path: |
            artifacts/releases/win-x64/axmol-hub-*-win-x64.exe
            artifacts/releases/win-x64/axmol-hub-*-win-x64.exe.sha256
            artifacts/releases/win-x64/*.nupkg
            artifacts/releases/win-x64/releases.*.json
          if-no-files-found: error

  package-osx-arm64:
    name: Package macOS arm64
    needs: meta
    if: needs.meta.outputs.should_package == 'true'
    runs-on: macos-15
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Prepare pinned Velopack CLI
        run: dotnet run --project tests/AxmolHub.Checks -c Release -- artifacts/packaging-tools --prepare-packaging

      - name: Build release packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE_BUILD: ${{ needs.meta.outputs.is_prerelease }}
        run: |
          $prereleaseBuild = $env:PRERELEASE_BUILD -eq 'true'
          ./installer/Publish.ps1 -Stage Build -Runtime osx-arm64 -PrereleaseBuild:$prereleaseBuild

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: osx-arm64
          path: |
            artifacts/releases/osx-arm64/axmol-hub-*-osx-arm64.pkg
            artifacts/releases/osx-arm64/axmol-hub-*-osx-arm64.pkg.sha256
            artifacts/releases/osx-arm64/*.nupkg
            artifacts/releases/osx-arm64/releases.*.json
          if-no-files-found: error

  package-osx-x64:
    name: Package macOS x64
    needs: meta
    if: needs.meta.outputs.should_package == 'true'
    runs-on: macos-15
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Prepare pinned Velopack CLI
        run: dotnet run --project tests/AxmolHub.Checks -c Release -- artifacts/packaging-tools --prepare-packaging

      - name: Build release packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE_BUILD: ${{ needs.meta.outputs.is_prerelease }}
        run: |
          $prereleaseBuild = $env:PRERELEASE_BUILD -eq 'true'
          ./installer/Publish.ps1 -Stage Build -Runtime osx-x64 -PrereleaseBuild:$prereleaseBuild

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: osx-x64
          path: |
            artifacts/releases/osx-x64/axmol-hub-*-osx-x64.pkg
            artifacts/releases/osx-x64/axmol-hub-*-osx-x64.pkg.sha256
            artifacts/releases/osx-x64/*.nupkg
            artifacts/releases/osx-x64/releases.*.json
          if-no-files-found: error

  package-linux-x64:
    name: Package Linux x64
    needs: meta
    if: needs.meta.outputs.should_package == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Prepare pinned Velopack CLI
        run: dotnet run --project tests/AxmolHub.Checks -c Release -- artifacts/packaging-tools --prepare-packaging

      - name: Build release packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE_BUILD: ${{ needs.meta.outputs.is_prerelease }}
        run: |
          $prereleaseBuild = $env:PRERELEASE_BUILD -eq 'true'
          ./installer/Publish.ps1 -Stage Build -Runtime linux-x64 -PrereleaseBuild:$prereleaseBuild

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-x64
          path: |
            artifacts/releases/linux-x64/axmol-hub-*-linux-x64.AppImage
            artifacts/releases/linux-x64/axmol-hub-*-linux-x64.AppImage.sha256
            artifacts/releases/linux-x64/*.nupkg
            artifacts/releases/linux-x64/releases.*.json
          if-no-files-found: error
