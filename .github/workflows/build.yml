# Build + verify + installer packaging: three responsibilities in one workflow, layered by job.
#   - meta: parses the commit title for "ver: x.y.z" and decides whether to package (an ordinary
#     commit is verified only, never packaged).
#   - verify: the three-platform matrix that checks the code is correct (compile, host detection, CLI
#     contract, download contract); it runs on every commit.
#   - package-*: four platforms, each running vpk pack on its own native runner (packaging cannot be
#     cross-built); only a release-marker commit or a manual trigger reaches them.
# Whether a release is published is decided by dist.yml from the commit message and the run result
# (the same split as axslcc's build.yml + dist.yml).
name: Build

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore:
      - '.github/workflows/dist.yml'
      - 'docs/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CONFIGURATION: Release
  DOTNET_SDK_VERSION: 10.0.x
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # ── Package or not: parse the commit title. An ordinary commit without a release marker is verified
  #    only, never packaged; only a release commit or a manual trigger walks the packaging path, which
  #    saves the expensive vpk pack for the run that really publishes. ──
  meta:
    name: Decide packaging
    runs-on: ubuntu-24.04
    outputs:
      should_package: ${{ steps.decide.outputs.should_package }}
      is_prerelease: ${{ steps.decide.outputs.is_prerelease }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Decide
        id: decide
        shell: pwsh
        run: |
          $msg = @(& git log -1 --format=%B) -join "`n"
          Write-Host "HEAD commit message: $msg"
          . ./installer/ReleaseMetadata.ps1
          & ./tests/ReleaseMetadata.Tests.ps1
          & ./tests/GitHubRelease.Tests.ps1
          [xml]$product = Get-Content -LiteralPath ./Directory.Build.props
          $productVersion = @($product.Project.PropertyGroup.Version) | Where-Object { $_ } | Select-Object -First 1
          $release = Get-ReleaseMetadata -CommitMessage $msg -FallbackVersion $productVersion
          # A manual trigger counts as a release (mirroring the manual version input dist's workflow_dispatch allows).
          $isDispatch = '${{ github.event_name }}' -eq 'workflow_dispatch'
          $should = ($isDispatch -or $release.IsVersionCommit) -and '${{ github.event_name }}' -ne 'pull_request'
          # Emit lowercase true/false, aligned with the job condition needs.meta.outputs.should_package == 'true'.
          $flag = if ($should) { 'true' } else { 'false' }
          $prereleaseFlag = if ($release.IsPrerelease) { 'true' } else { 'false' }
          "should_package=$flag" >> $env:GITHUB_OUTPUT
          "is_prerelease=$prereleaseFlag" >> $env:GITHUB_OUTPUT
          Write-Host "should_package=$flag"
          Write-Host "is_prerelease=$prereleaseFlag"

  # ── Verify: the code is not broken. A three-platform matrix, decoupled from packaging, so a failure
  #    here means a code regression and says nothing about a release. ──
  verify:
    name: Verify (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            rid: win-x64
            host: windows
          - os: windows-11-arm
            label: Windows arm64
            rid: win-arm64
            host: windows
          - os: macos-15
            label: macOS arm64
            rid: osx-arm64
            host: macos
          - os: ubuntu-24.04
            label: Linux x64
            rid: linux-x64
            host: linux
          - os: ubuntu-24.04-arm
            label: Linux arm64
            rid: linux-arm64
            host: linux
    steps:
      # Every official action takes a floating major tag: those majors require Actions Runner >= 2.327.1
      # (the Node.js 24 runtime), which GitHub-hosted runners satisfy. Moving to a self-hosted runner
      # means upgrading the runner first.
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      # The env above only *asks* for 10.0.x; which patch version setup-dotnet actually resolves to is
      # what decides the compiler version, and that difference has bitten for real (2026-10-03): a
      # local Ubuntu installing dotnet-sdk-8.0 through apt only gets 8.0.1xx (compiler 4.8.0.0), while
      # the Avalonia 12.1.4 analyzers and generators are compiled against 4.14, so the source generator
      # emits nothing at all and the build fails with a row of
      # `CS0103: The name 'InitializeComponent' does not exist`.
      # When a local build and CI ever disagree, compare this line first instead of guessing.
      - name: Print .NET SDK version
        run: |
          dotnet --version
          dotnet --info

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ matrix.rid }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ matrix.rid }}-

      # There is no solution file in this repo: the projects build independently, one csproj per
      # invocation.
      - name: Build Core
        run: dotnet build src/AxmolHub.Core/AxmolHub.Core.csproj -c ${{ env.CONFIGURATION }}

      - name: Build CLI
        run: dotnet build src/AxmolHub.Cli/AxmolHub.Cli.csproj -c ${{ env.CONFIGURATION }}

      # The runtime floor. TargetFramework net8.0 plus the default roll-forward policy (Minor, which
      # never crosses a major version) adds up to a hard lock on the 8.0 runtime: Ubuntu 26.04's archive
      # no longer carries dotnet-runtime-8.0, and a Windows dev machine that installed only
      # `Microsoft.DotNet.SDK.10` has the same problem (that SDK brings the 10.0 runtime and no 8.0).
      # `RollForward=Major` in Directory.Build.props turns that from a version lock back into a floor,
      # and the SDK writes it into the runtimeconfig.json of every executable artifact.
      # What this step proves is only that the property really lands in that file. It cannot prove the
      # app actually rolls forward: the runner ships 8.0, so it still takes the 8.0 branch. The real
      # proof needs a machine without 8.0 (measured 2026-10-15 on Ubuntu 26.04.1).
      # It is kept anyway because a property that gets renamed or moved out of the props file would
      # make the floor disappear silently, and this step goes red instead.
      - name: Verify runtime floor
        shell: bash
        run: |
          set -euo pipefail
          f=src/AxmolHub.Cli/bin/Release/net8.0/AxmolHub.Cli.runtimeconfig.json
          test -f "$f" || { echo "::error::missing $f"; exit 1; }
          grep -q '"rollForward": "Major"' "$f" || { echo "::error::$f does not declare rollForward=Major"; exit 1; }
          cat "$f"

      # Host detection (BuildTargets.Host) is the earliest OS-dependent branch in Core, and whether a
      # target can be built on this host decides directly what the GUI shows the user, so all three
      # platforms assert it. (The secret-store backend branches on OS as well — see --check-secrets
      # below; that assertion covers only the CLI half of it.)
      - name: Verify host detection
        shell: bash
        run: |
          set -euo pipefail
          dotnet src/AxmolHub.Cli/bin/Release/net8.0/AxmolHub.Cli.dll targets | tr -d '\r' | tee targets.txt
          expect() {
            grep -qE "^$1[[:space:]]+.*current=$2$" targets.txt || { echo "::error::$1 expected current=$2"; exit 1; }
          }
          case "${{ matrix.host }}" in
            windows)
              expect windows-x64 True
              expect uwp-x64 True
              expect android-arm64 True
              expect wasm32 True
              expect linux-x64 False
              expect macos-arm64 False
              expect ios-arm64 False
              ;;
            macos)
              expect macos-arm64 True
              expect macos-x64 True
              expect ios-arm64 True
              expect tvos-arm64 True
              expect android-arm64 True
              expect wasm32 True
              expect windows-x64 False
              expect uwp-x64 False
              expect linux-x64 False
              ;;
            linux)
              expect linux-x64 True
              expect android-arm64 True
              expect wasm32 True
              expect windows-x64 False
              expect uwp-x64 False
              expect macos-arm64 False
              expect ios-arm64 False
              ;;
          esac

      - name: Verify CLI help
        shell: bash
        run: |
          set -euo pipefail
          dotnet src/AxmolHub.Cli/bin/Release/net8.0/AxmolHub.Cli.dll help | tr -d '\r' | tee help.txt
          grep -q 'install-tools' help.txt

      # The Avalonia GUI is net8.0 with no Windows-specific target framework, so all three platforms
      # must build it. This is the only GUI *build* step: after P6 deleted the WPF version, Avalonia is
      # the only implementation the App has.
      - name: Build App (GUI)
        run: dotnet build src/AxmolHub/AxmolHub.csproj -c ${{ env.CONFIGURATION }}

      # The secret store is *OS-branched* product behaviour, and neither route on the Windows side can
      # reach the Linux path: the Checks project is net8.0-windows, and --verify-shell needs a display,
      # which CI never really provides (see docs/ci.md §2.2). So the App's headless self-check fills
      # that cell: it returns before Avalonia starts, needs no X11, and runs the production entry point
      # SecretStoreFactory.Create(), not a second, test-only implementation.
      # On macOS "no backend on this platform yet" is a PASS branch (Keychain is deliberately deferred;
      # the matrix should not go red for it).
      - name: Verify secret store on this host
        shell: bash
        run: |
          set -euo pipefail
          dotnet src/AxmolHub/bin/Release/net8.0/AxmolHub.dll --check-secrets | tr -d '\r' | tee secrets.txt
          grep -q '^backend=' secrets.txt
          if [ "${{ matrix.host }}" = linux ]; then
            grep -q '^backend=encryptedfile$' secrets.txt
          fi
          ! grep -q '^FAIL' secrets.txt

      # macOS notifications are hand-written Objective-C ABI: a global block plus two dynamically added
      # delegate methods. A wrong offset or type encoding compiles cleanly and simply never paints a banner,
      # which is the same symptom as a channel that was never wired up. The check returns before Avalonia,
      # needs no desktop session, and never requests authorization; a person still clicks one real banner.
      - name: Verify macOS notification contract
        if: matrix.host == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          dotnet src/AxmolHub/bin/Release/net8.0/AxmolHub.dll --check-macos-notifications | tr -d '\r' | tee macos-notifications.txt
          ! grep -q '^FAIL' macos-notifications.txt

      # Checks is net8.0-windows (the Windows-only assertions need it), so it stays on Windows.
      # This step only compiles: the headless-screenshot stage was removed, for the reason in
      # docs/ci.md §2.2.
      - name: Build behavior checks
        if: matrix.host == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          dotnet build tests/AxmolHub.Checks/AxmolHub.Checks.csproj -c ${{ env.CONFIGURATION }}

      # --json is part of Hub's outward contract (docs/cli-json-contract.md), and its only failure mode
      # is "stdout is no longer exactly one JSON document" — a mistake neither the compiler nor a shape
      # assertion catches (that is how `help` slipped through). This mode returns on its own and needs
      # no real engine or toolchain, so it can run on a clean runner. It is confined to Windows because
      # Checks is net8.0-windows (the Windows-only assertions in Core need it), not because the contract
      # holds only there — the CLI itself publishes for all three platforms. The bin/Release path is
      # written the same way as the host-detection step above.
      - name: Verify CLI JSON contract
        if: matrix.host == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project tests/AxmolHub.Checks -c ${{ env.CONFIGURATION }} -- \
            artifacts/checks --check-cli-json src/AxmolHub.Cli/bin/Release/net8.0/AxmolHub.Cli.dll

      # The download contract (atomic write to disk / cache reuse / bad-hash rejection / resume /
      # streaming SHA-256) returns on its own, uses an injected FixtureHandler, needs no network and no
      # real engine, so it can run on a clean runner.
      - name: Verify download contract
        if: matrix.host == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project tests/AxmolHub.Checks -c ${{ env.CONFIGURATION }} -- \
            artifacts/checks --check-download

      # The secret format (AAD binding, tamper rejection, recognising a foreign DPAPI blob), the backend
      # selection table, the key-path precedence, OAuth callback parsing and the Linux browser launch
      # argument table are all pure functions or injected fake transports, so the Linux branches can be
      # asserted from Windows; the Linux half that really runs on the host is --check-secrets above.
      - name: Verify secret store contract
        if: matrix.host == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project tests/AxmolHub.Checks -c ${{ env.CONFIGURATION }} -- \
            artifacts/checks --check-secret-store

      - name: Publish self-contained CLI
        run: dotnet publish src/AxmolHub.Cli/AxmolHub.Cli.csproj -c ${{ env.CONFIGURATION }} -r ${{ matrix.rid }} --self-contained true -o artifacts/cli/${{ matrix.rid }}

      # Cross-publishing is not the same as working: a self-contained artifact must have actually been
      # executed on the target host.
      - name: Run published CLI on this host
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.host }}" in
            windows) exe=artifacts/cli/${{ matrix.rid }}/AxmolHub.Cli.exe ;;
            *)       exe=artifacts/cli/${{ matrix.rid }}/AxmolHub.Cli ;;
          esac
          test -f "$exe" || { echo "::error::missing published host binary: $exe"; exit 1; }
          ls -l "$exe"
          "$exe" targets | tr -d '\r' | head -3

      # There used to be an "Upload CLI host" step here, uploading artifacts/cli/<rid> as cli-<rid>.
      # Removed 2026-10-03: nothing downstream consumed it (the release chain's App artifacts are
      # published by installer/Build.ps1 and never read CI's CLI artifacts), and what it meant to prove
      # — that the artifact is usable — the two steps above already prove (publish, then really run it
      # on the target host); the artifact only stored the same conclusion a second time.

  # ── Packaging: the installer artifacts. An artifact name must equal the platform directory name
  #    exactly (win-x64 and so on), because dist's Publish-All.ps1 looks for a subdirectory by that
  #    platform directory name (Dir) inside the download directory. ──
  package-win-x64:
    name: Package Windows x64
    needs: meta
    if: needs.meta.outputs.should_package == 'true'
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-release-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-release-

      - name: Prepare pinned Velopack CLI
        run: dotnet run --project tests/AxmolHub.Checks -c Release -- cache/packaging-tools --prepare-packaging

      - name: Build release packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE_BUILD: ${{ needs.meta.outputs.is_prerelease }}
          ORCAROUTER_APP_ID: ${{ secrets.ORCAROUTER_APP_ID }}
        run: |
          $prereleaseBuild = $env:PRERELEASE_BUILD -eq 'true'
          ./installer/Publish.ps1 -Stage Build -Runtime win-x64 -PrereleaseBuild:$prereleaseBuild

      - name: Isolated install acceptance
        shell: pwsh
        env:
          ORCAROUTER_APP_ID: ${{ secrets.ORCAROUTER_APP_ID }}
        run: ./installer/Test.ps1 -Isolated

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: win-x64
          path: |
            artifacts/releases/win-x64/axmol-hub-*-win-x64.exe
            artifacts/releases/win-x64/axmol-hub-*-win-x64.exe.sha256
            artifacts/releases/win-x64/*.nupkg
            artifacts/releases/win-x64/releases.*.json
          if-no-files-found: error

  package-osx-arm64:
    name: Package macOS arm64
    needs: meta
    if: needs.meta.outputs.should_package == 'true'
    runs-on: macos-15
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Prepare pinned Velopack CLI
        run: dotnet run --project tests/AxmolHub.Checks -c Release -- cache/packaging-tools --prepare-packaging

      - name: Build release packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE_BUILD: ${{ needs.meta.outputs.is_prerelease }}
          ORCAROUTER_APP_ID: ${{ secrets.ORCAROUTER_APP_ID }}
        run: |
          $prereleaseBuild = $env:PRERELEASE_BUILD -eq 'true'
          ./installer/Publish.ps1 -Stage Build -Runtime osx-arm64 -PrereleaseBuild:$prereleaseBuild

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: osx-arm64
          path: |
            artifacts/releases/osx-arm64/axmol-hub-*-osx-arm64.pkg
            artifacts/releases/osx-arm64/axmol-hub-*-osx-arm64.pkg.sha256
            artifacts/releases/osx-arm64/*.nupkg
            artifacts/releases/osx-arm64/releases.*.json
          if-no-files-found: error

  package-osx-x64:
    name: Package macOS x64
    needs: meta
    if: needs.meta.outputs.should_package == 'true'
    runs-on: macos-15
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Prepare pinned Velopack CLI
        run: dotnet run --project tests/AxmolHub.Checks -c Release -- cache/packaging-tools --prepare-packaging

      - name: Build release packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE_BUILD: ${{ needs.meta.outputs.is_prerelease }}
          ORCAROUTER_APP_ID: ${{ secrets.ORCAROUTER_APP_ID }}
        run: |
          $prereleaseBuild = $env:PRERELEASE_BUILD -eq 'true'
          ./installer/Publish.ps1 -Stage Build -Runtime osx-x64 -PrereleaseBuild:$prereleaseBuild

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: osx-x64
          path: |
            artifacts/releases/osx-x64/axmol-hub-*-osx-x64.pkg
            artifacts/releases/osx-x64/axmol-hub-*-osx-x64.pkg.sha256
            artifacts/releases/osx-x64/*.nupkg
            artifacts/releases/osx-x64/releases.*.json
          if-no-files-found: error

  package-linux-x64:
    name: Package Linux x64
    needs: meta
    if: needs.meta.outputs.should_package == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Prepare pinned Velopack CLI
        run: dotnet run --project tests/AxmolHub.Checks -c Release -- cache/packaging-tools --prepare-packaging

      - name: Build release packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE_BUILD: ${{ needs.meta.outputs.is_prerelease }}
          ORCAROUTER_APP_ID: ${{ secrets.ORCAROUTER_APP_ID }}
        run: |
          $prereleaseBuild = $env:PRERELEASE_BUILD -eq 'true'
          ./installer/Publish.ps1 -Stage Build -Runtime linux-x64 -PrereleaseBuild:$prereleaseBuild

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-x64
          path: |
            artifacts/releases/linux-x64/axmol-hub-linux-x64.AppImage
            artifacts/releases/linux-x64/axmol-hub-linux-x64.AppImage.sha256
            artifacts/releases/linux-x64/*.nupkg
            artifacts/releases/linux-x64/releases.*.json
          if-no-files-found: error

  package-win-arm64:
    name: Package Windows arm64
    needs: meta
    if: needs.meta.outputs.should_package == 'true'
    runs-on: windows-11-arm
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}
      - name: Prepare pinned Velopack CLI
        run: dotnet run --project tests/AxmolHub.Checks -c Release -- cache/packaging-tools --prepare-packaging
      - name: Build release packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE_BUILD: ${{ needs.meta.outputs.is_prerelease }}
          ORCAROUTER_APP_ID: ${{ secrets.ORCAROUTER_APP_ID }}
        run: |
          $prereleaseBuild = $env:PRERELEASE_BUILD -eq 'true'
          ./installer/Publish.ps1 -Stage Build -Runtime win-arm64 -PrereleaseBuild:$prereleaseBuild
      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: win-arm64
          path: |
            artifacts/releases/win-arm64/axmol-hub-*-win-arm64.exe
            artifacts/releases/win-arm64/axmol-hub-*-win-arm64.exe.sha256
            artifacts/releases/win-arm64/*.nupkg
            artifacts/releases/win-arm64/releases.*.json
          if-no-files-found: error

  package-linux-arm64:
    name: Package Linux arm64
    needs: meta
    if: needs.meta.outputs.should_package == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}
      - name: Prepare pinned Velopack CLI
        run: dotnet run --project tests/AxmolHub.Checks -c Release -- cache/packaging-tools --prepare-packaging
      - name: Build release packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE_BUILD: ${{ needs.meta.outputs.is_prerelease }}
          ORCAROUTER_APP_ID: ${{ secrets.ORCAROUTER_APP_ID }}
        run: |
          $prereleaseBuild = $env:PRERELEASE_BUILD -eq 'true'
          ./installer/Publish.ps1 -Stage Build -Runtime linux-arm64 -PrereleaseBuild:$prereleaseBuild
      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-arm64
          path: |
            artifacts/releases/linux-arm64/axmol-hub-linux-arm64.AppImage
            artifacts/releases/linux-arm64/axmol-hub-linux-arm64.AppImage.sha256
            artifacts/releases/linux-arm64/*.nupkg
            artifacts/releases/linux-arm64/releases.*.json
          if-no-files-found: error
