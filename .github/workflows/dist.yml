# Release orchestration: recognize "ver: x.y.z" titles to decide whether to release, download the
# three platforms' artifacts, and upload them merged into one release.
# Triggers = workflow_run (listening for a completed build) + workflow_dispatch (manual version input).
# Same semantics as axslcc's dist.yml: every completed build triggers it, and a regex on the commit
# message plus the run result decide whether a release really happens.
name: Dist

on:
  workflow_run:
    workflows: [Build]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (fallback when the commit subject has no release version)'
        required: false

permissions:
  contents: write

jobs:
  dist:
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0

      # The release marker: ver: 1.8.0; ver: 1.8.0-beta and ver: 1.8.0 (Preview) are accepted too.
      # When nothing matches, the manually entered version is used; with neither, release_ver is empty
      # and every later step is skipped.
      - name: Check release version
        id: check_ver
        shell: pwsh
        env:
          MANUAL_VERSION: ${{ github.event.inputs.version }}
        run: |
          # Hand the raw message (%B) to the parser, not %s: %s is git's first paragraph, so a version
          # commit with its body in the same paragraph would miss the 'ver: x.y.z' match and this
          # release would silently never happen. Get-ReleaseMetadata reads the title line.
          $commit_msg = @(& git show -s --format=%B) -join "`n"
          Write-Host "Parsing release version from commit message: $commit_msg"
          . ./installer/ReleaseMetadata.ps1
          $release = Get-ReleaseMetadata -CommitMessage $commit_msg -FallbackVersion $env:MANUAL_VERSION
          $release_ver = $release.Version
          $prerelease = if ($release.IsPrerelease) { 'true' } else { 'false' }
          Write-Host "release_ver=$release_ver"
          "release_ver=$release_ver" >> $env:GITHUB_OUTPUT
          "is_prerelease=$prerelease" >> $env:GITHUB_OUTPUT
          "release_tag=v$release_ver" >> $env:GITHUB_OUTPUT
          "release_target=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT

      - name: Build release notes
        id: release_notes
        if: steps.check_ver.outputs.release_ver != ''
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.check_ver.outputs.release_tag }}
          REPOSITORY_URL: https://github.com/${{ github.repository }}
        run: |
          . ./installer/ReleaseMetadata.ps1
          $targetCommit = "$(git rev-parse HEAD)"
          $previousTag = "$(git describe --tags --abbrev=0 --exclude=$env:RELEASE_TAG $targetCommit 2>$null)"
          if ($LASTEXITCODE -ne 0) { $previousTag = '' }

          $range = if ($previousTag) { "$previousTag..$targetCommit" } else { $targetCommit }
          # One note per commit, and that note is the title. %s cannot give that: it is git's first
          # *paragraph*, so a body written without a blank line under the title folds into the
          # "subject" and pastes the whole essay into the release. Read %B and keep only the line that
          # opens a record ('<full sha>\t<short>\t<title>'); every other line of the record is body.
          $logLines = @(& git log --reverse --format='%H%x09%h%x09%B' $range)
          if ($LASTEXITCODE -ne 0) { throw "git log failed with $LASTEXITCODE." }
          if ($logLines.Count -eq 0) { throw "No commits found for release range $range." }

          $notes = Get-ReleaseNotes -LogLines $logLines -RepositoryUrl $env:REPOSITORY_URL -PreviousTag $previousTag -ReleaseTag $env:RELEASE_TAG -ReadTouchedFiles {
            param($sha)
            $touched = @(& git show --name-only --format='' $sha | Where-Object { $_ })
            if ($LASTEXITCODE -ne 0) { throw "git show failed with $LASTEXITCODE for $sha." }
            $touched
          }
          foreach ($warning in $notes.Warnings) { Write-Host $warning }

          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Set-Content -LiteralPath $notesPath -Encoding UTF8 -Value $notes.Lines
          Write-Host "Release notes contain $($notes.CommitCount) commit(s) after '$previousTag'."
          Get-Content -LiteralPath $notesPath
          "notes_file=$notesPath" >> $env:GITHUB_OUTPUT

      - name: Download artifacts
        if: steps.check_ver.outputs.release_ver != ''
        uses: dawidd6/action-download-artifact@v11
        with:
          workflow: build.yml
          workflow_conclusion: success
          github_token: ${{ secrets.GITHUB_TOKEN }}
          path: ./downloaded

      - name: Publish release
        if: steps.check_ver.outputs.release_ver != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.check_ver.outputs.release_ver }}
          RELEASE_PRERELEASE: ${{ steps.check_ver.outputs.is_prerelease }}
          RELEASE_TARGET: ${{ steps.check_ver.outputs.release_target }}
          RELEASE_NOTES_FILE: ${{ steps.release_notes.outputs.notes_file }}
        run: |
          $prerelease = $env:RELEASE_PRERELEASE -eq 'true'
          ./installer/Publish-All.ps1 -Version $env:RELEASE_VERSION -ArtifactDir ./downloaded -TargetCommit $env:RELEASE_TARGET -NotesFile $env:RELEASE_NOTES_FILE -Prerelease:$prerelease
