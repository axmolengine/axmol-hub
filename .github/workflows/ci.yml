name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CONFIGURATION: Release
  DOTNET_SDK_VERSION: 8.0.x
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  hosts:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            rid: win-x64
            host: windows
          - os: macos-latest
            label: macOS arm64
            rid: osx-arm64
            host: macos
          - os: ubuntu-latest
            label: Linux x64
            rid: linux-x64
            host: linux
    steps:
      # action 均取浮动主版本标签：这些主版本要求 Actions Runner >= 2.327.1（Node.js 24 运行时），
      # GitHub 托管 runner 满足。迁移到自托管 runner 时需先升级 runner。
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      # 上面的 env 只是"申请 8.0.x"，setup-dotnet 实际解析到哪个补丁版本才决定编译器版本。
      # 这个差异已经真实咬过一次（2026-10-03）：本机 Ubuntu 用 apt 装 dotnet-sdk-8.0
      # 只能拿到 8.0.1xx（编译器 4.8.0.0），而 Avalonia 12.1.3 的分析器与生成器是按
      # 4.14 编译的，源生成器整个不产出，表现为一排
      # `CS0103: The name 'InitializeComponent' does not exist`。
      # 以后本机与 CI 构建结果不一致时，先比这一行，不要靠猜。
      - name: Print .NET SDK version
        run: |
          dotnet --version
          dotnet --info

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ matrix.rid }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ matrix.rid }}-

      # 仓库没有解决方案文件：四个项目各自独立构建，一次只能接一个 csproj。
      - name: Build Core
        run: dotnet build src/AxmolHub.Core/AxmolHub.Core.csproj -c ${{ env.CONFIGURATION }}

      - name: Build CLI
        run: dotnet build src/AxmolHub.Cli/AxmolHub.Cli.csproj -c ${{ env.CONFIGURATION }}

      # 宿主判定（BuildTargets.Host）是 Core 里唯一按操作系统分叉的逻辑，
      # 目标是否可在本机构建直接决定 GUI 给用户显示什么，因此三个平台都要断言。
      - name: Verify host detection
        shell: bash
        run: |
          set -euo pipefail
          dotnet src/AxmolHub.Cli/bin/Release/net8.0/AxmolHub.Cli.dll targets | tr -d '\r' | tee targets.txt
          expect() {
            grep -qE "^$1[[:space:]]+.*current=$2$" targets.txt || { echo "::error::$1 expected current=$2"; exit 1; }
          }
          case "${{ matrix.host }}" in
            windows)
              expect windows-x64 True
              expect uwp-x64 True
              expect android-arm64 True
              expect wasm32 True
              expect linux-x64 False
              expect macos-arm64 False
              expect ios-arm64 False
              ;;
            macos)
              expect macos-arm64 True
              expect macos-x64 True
              expect ios-arm64 True
              expect tvos-arm64 True
              expect android-arm64 True
              expect wasm32 True
              expect windows-x64 False
              expect uwp-x64 False
              expect linux-x64 False
              ;;
            linux)
              expect linux-x64 True
              expect android-arm64 True
              expect wasm32 True
              expect windows-x64 False
              expect uwp-x64 False
              expect macos-arm64 False
              expect ios-arm64 False
              ;;
          esac

      - name: Verify CLI help
        shell: bash
        run: |
          set -euo pipefail
          dotnet src/AxmolHub.Cli/bin/Release/net8.0/AxmolHub.Cli.dll help | tr -d '\r' | tee help.txt
          grep -q 'install-tools' help.txt

      # Avalonia 版 GUI 是 net8.0，不含任何 Windows 专属目标框架，因此三平台都必须构建。
      # 这是唯一的 GUI 构建步骤：P6 删掉 WPF 版后，App 就只剩 Avalonia 这一个实现了。
      - name: Build App (GUI)
        run: dotnet build src/AxmolHub.App/AxmolHub.App.csproj -c ${{ env.CONFIGURATION }}

      # Checks 是 net8.0-windows（Core 里 Windows 特有的断言需要它），因此留在 Windows。
      # 这里只做编译验证，不跑 GUI：无头截图环节已去掉，理由见 docs/ci.md §2.2。
      - name: Build behavior checks
        if: matrix.host == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          dotnet build tests/AxmolHub.Checks/AxmolHub.Checks.csproj -c ${{ env.CONFIGURATION }}

      # --json 是 Hub 对外契约的一部分（docs/cli-json-contract.md），它唯一的失败模式是
      # "stdout 不再是恰好一份 JSON 文档" —— 编译期和形状断言都测不到那种错（help 就是这么漏过去的）。
      # 该模式自带 return，不需要真实引擎与工具链，因此能在干净 runner 上跑。
      # 只放 Windows 是因为 Checks 是 net8.0-windows（Core 里 Windows 特有的断言需要它），
      # 不是因为这个契约只在 Windows 成立 —— CLI 本身三平台都发布。
      # bin/Release 的写法与上面的"宿主判定"步骤一致。
      - name: Verify CLI JSON contract
        if: matrix.host == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project tests/AxmolHub.Checks -c ${{ env.CONFIGURATION }} -- \
            artifacts/checks --check-cli-json src/AxmolHub.Cli/bin/Release/net8.0/AxmolHub.Cli.dll

      # 下载契约（原子落盘 / 缓存复用 / 坏哈希拒绝 / 断点续传 / 流式 SHA-256）自带 return、
      # 用注入的 FixtureHandler、不联网、不依赖真实引擎，因此能在干净 runner 上跑。
      - name: Verify download contract
        if: matrix.host == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project tests/AxmolHub.Checks -c ${{ env.CONFIGURATION }} -- \
            artifacts/checks --check-download

      - name: Publish self-contained CLI
        run: dotnet publish src/AxmolHub.Cli/AxmolHub.Cli.csproj -c ${{ env.CONFIGURATION }} -r ${{ matrix.rid }} --self-contained true -o artifacts/cli/${{ matrix.rid }}

      # 交叉发布不等于可用：自包含产物必须在目标宿主上真的执行过。
      - name: Run published CLI on this host
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.host }}" in
            windows) exe=artifacts/cli/${{ matrix.rid }}/AxmolHub.Cli.exe ;;
            *)       exe=artifacts/cli/${{ matrix.rid }}/AxmolHub.Cli ;;
          esac
          test -f "$exe" || { echo "::error::missing published host binary: $exe"; exit 1; }
          ls -l "$exe"
          "$exe" targets | tr -d '\r' | head -3

      # 这里曾有一步 "Upload CLI host"，把 artifacts/cli/<rid> 作为 cli-<rid> 上传。2026-10-03 删除：
      # 没有任何后续消费方（发布链路的 App 产物由 installer/Build.ps1 自行发布，不读 CI 的 CLI 产物），
      # 它想证明的"产物可用"已由上面两步（发布 + 在目标宿主真跑）证明，artifact 只是把同一个结论再存一份。
