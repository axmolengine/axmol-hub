name: Windows release

on:
  workflow_dispatch:
  push:
    tags: [v*]

permissions:
  # `read` is not enough for the publish step: gh release create/upload needs to write
  # release assets.
  contents: write

env:
  DOTNET_SDK_VERSION: 8.0.x
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  package:
    name: Package and install acceptance
    runs-on: windows-latest
    steps:
      # action 均取浮动主版本标签：这些主版本要求 Actions Runner >= 2.327.1（Node.js 24 运行时）。
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-release-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-release-

      # 固定 1.2.161：先校验 installer/packaging-manifest.json 里的 SHA-256，
      # 再从已校验的本地源把 vpk 装进工作区，不修改 PATH。
      - name: Prepare pinned Velopack CLI
        run: dotnet run --project tests/AxmolHub.Checks -c Release -- artifacts/packaging-tools --prepare-packaging

      # Publish.ps1 -Stage Build: pull the previous release down so vpk can emit a delta,
      # then publish the self-contained App with Build.ps1. The installer is renamed to
      # axmol-hub-<version>-<runtime>.exe; the update payload keeps its vpk-derived name.
      - name: Build release packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./installer/Publish.ps1 -Stage Build

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: |
            artifacts/releases/win-x64/axmol-hub-*-win-x64.exe
            artifacts/releases/win-x64/axmol-hub-*-win-x64.exe.sha256
            artifacts/releases/win-x64/*.nupkg
            artifacts/releases/win-x64/releases.*.json
          if-no-files-found: error

      # 一次性 packId / 程序名 / 安装目录 + 中文路径，验证安装、载荷完整、自包含启动、
      # 跨版本升级保留用户数据、卸载移除载荷与注册项且保留用户数据；不触碰 runner 上其它状态。
      # 排在发布之前：验收不通过就不该有新的 release 出现。
      - name: Isolated install acceptance
        shell: pwsh
        run: ./installer/Test.ps1 -Isolated

      # 只上传「人下载的安装包 + 更新载荷 + 更新索引」：更新读的是 releases.win.json 与
      # 它引用的 .nupkg，Portable.zip / assets.win.json / RELEASES 都不参与。
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./installer/Publish.ps1 -Stage Upload

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: install-acceptance
          path: artifacts/install-checks/
          if-no-files-found: warn

# 代码签名尚未接入。Windows 计划走 SignPath Foundation 的免费 OSS 签名，
# 细节与前置条件见 docs/hub-development-plan.md §4 D5。
# 注意 SignPath **不支持 macOS**：Gatekeeper 只认 Apple 签发的 Developer ID + 公证，
# 第三方即便有 HSM 也替代不了（官方文档的签名格式表里没有 .app / .pkg / .dmg）。
# macOS 侧要么上 Apple Developer Program，要么在下载页给出 xattr 去隔离的指引。
#
# 版本标签必须与 Directory.Build.props 的 Version 一致（Publish.ps1 会拦），
# 因为 feed、nupkg 名与安装包名都带这个版本号，而 release 页是按 tag 组织的。
# 标签不随打包器变化，因此 Windows 之外的平台接入后无需再改这个 workflow。
